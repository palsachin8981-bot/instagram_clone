<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }

    /* Navbar */
    .navbar {
      height: 60px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-family: cursive;
      font-size: 28px;
      font-weight: bold;
    }

    .search {
      background: #f1f1f1;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      width: 250px;
      outline: none;
    }

    .nav-icons {
      display: flex;
      gap: 20px;
      font-size: 23px;
      cursor: pointer;
    }

    /* Main */
    .container {
      width: 600px;
      max-width: 95%;
      margin: 25px auto;
    }

    /* Stories */
    .stories {
      display: flex;
      gap: 18px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      overflow-x: auto;
    }

    .story {
      min-width: 65px;
      text-align: center;
      font-size: 12px;
    }

    .story img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 2px;
      border: 3px solid #e1306c;
      object-fit: cover;
      display: block;
      margin-bottom: 5px;
    }

    /* Post */
    .post {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 25px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 12px;
      gap: 10px;
    }

    .post-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .username {
      font-weight: bold;
    }

    .post-image {
      width: 100%;
      display: block;
      max-height: 650px;
      object-fit: cover;
    }

    .actions {
      display: flex;
      gap: 18px;
      padding: 12px;
      font-size: 25px;
    }

    .actions span {
      cursor: pointer;
    }

    .like-btn.liked {
      color: red;
    }

    .post-content {
      padding: 0 12px 15px;
    }

    .likes {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      margin-bottom: 8px;
    }

    .comments {
      color: #777;
      margin-bottom: 10px;
    }

    .comment-box {
      display: flex;
      border-top: 1px solid #eee;
      padding: 10px;
    }

    .comment-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .comment-box button {
      border: none;
      background: none;
      color: #0095f6;
      font-weight: bold;
      cursor: pointer;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .navbar {
        padding: 0 15px;
      }

      .search {
        display: none;
      }

      .nav-icons {
        gap: 12px;
      }

      .container {
        width: 100%;
        max-width: 100%;
        margin: 10px 0;
      }

      .stories,
      .post {
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Instagram</div>

    <input
      class="search"
      type="text"
      placeholder="Search"
      id="search"
    >

    <div class="nav-icons">
      <span>⌂</span>
      <span>♡</span>
      <span>✉</span>
      <span>＋</span>
    </div>
  </nav>

  <main class="container">

    <!-- Stories -->
    <section class="stories">

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=1">
        <span>Alex</span>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=2">
        <span>Sarah</span>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=3">
        <span>Mike</span>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=4">
        <span>Emma</span>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=5">
        <span>John</span>
      </div>

      <div class="story">
        <img src="https://i.pravatar.cc/100?img=6">
        <span>Lisa</span>
      </div>

    </section>

    <!-- Post -->
    <article class="post">

      <div class="post-header">
        <img src="https://i.pravatar.cc/100?img=12">
        <span class="username">travel_user</span>
      </div>

      <img
        class="post-image"
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80"
        alt="Travel photo"
      >

      <div class="actions">
        <span class="like-btn" onclick="toggleLike(this)">♡</span>
        <span>💬</span>
        <span>➤</span>
        <span style="margin-left:auto">🔖</span>
      </div>

      <div class="post-content">
        <div class="likes">
          <span class="like-count">1,245</span> likes
        </div>

        <div class="caption">
          <b>travel_user</b>
          Exploring beautiful places 🌄✨
        </div>

        <div class="comments" id="comments">
          View all 24 comments
        </div>
      </div>

      <div class="comment-box">
        <input
          type="text"
          id="commentInput"
          placeholder="Add a comment..."
        >
        <button onclick="addComment()">Post</button>
      </div>

    </article>


    <!-- Second Post -->
    <article class="post">

      <div class="post-header">
        <img src="https://i.pravatar.cc/100?img=20">
        <span class="username">foodie_world</span>
      </div>

      <img
        class="post-image"
        src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80"
        alt="Food"
      >

      <div class="actions">
        <span class="like-btn" onclick="toggleLike(this)">♡</span>
        <span>💬</span>
        <span>➤</span>
        <span style="margin-left:auto">🔖</span>
      </div>

      <div class="post-content">
        <div class="likes">
          <span class="like-count">842</span> likes
        </div>

        <div class="caption">
          <b>foodie_world</b>
          Good food, good mood 🍕❤️
        </div>

        <div class="comments">
          View all 12 comments
        </div>
      </div>

    </article>

  </main>


  <script>
    // Like button
    function toggleLike(button) {
      const post = button.closest(".post");
      const countElement = post.querySelector(".like-count");

      let count = parseInt(
        countElement.textContent.replace(",", "")
      );

      if (button.classList.contains("liked")) {
        button.classList.remove("liked");
        button.textContent = "♡";
        count--;
      } else {
        button.classList.add("liked");
        button.textContent = "♥";
        count++;
      }

      countElement.textContent = count.toLocaleString();
    }


    // Add comment
    function addComment() {
      const input = document.getElementById("commentInput");
      const comments = document.getElementById("comments");

      if (input.value.trim() === "") {
        return;
      }

      comments.innerHTML =
        "<b>You:</b> " + input.value;

      input.value = "";
    }


    // Search
    document.getElementById("search").addEventListener(
      "keyup",
      function () {
        const query = this.value.toLowerCase();
        const posts = document.querySelectorAll(".post");

        posts.forEach(post => {
          const username =
            post.querySelector(".username").textContent.toLowerCase();

          post.style.display =
            username.includes(query) ? "block" : "none";
        });
      }
    );
  </script>

</body>
</html>
